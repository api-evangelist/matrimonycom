description: 'Matrimony.com Limited is an India-based online matchmaking and wedding
  services company, publicly listed on the NSE and BSE and headquartered in Chennai.
  Founded by Murugavel Janakiraman, it operates the flagship BharatMatrimony brand
  alongside a large portfolio of regional and community matrimony sites (Tamil, Telugu,
  Kannada, Bengali, and religion- and community-based platforms), the premium EliteMatrimony
  service, and wedding-services properties including WeddingBazaar and Mandap.com. The
  company serves millions of customers each month across its matchmaking and marriage
  marketplace. It was surfaced as a portfolio company of Bessemer Venture Partners and
  added to the API Evangelist network. As of this enrichment pass, Matrimony.com publishes
  a corporate/investor and consumer-brand web presence but exposes no public developer
  API, developer portal, OpenAPI, SDKs, or /.well-known discovery surface.'
